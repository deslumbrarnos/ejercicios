<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Práctica 12 - Formulario, yeii</title>
</head>
<body>
    <form action="recibeParametros.php" method="post" enctype="multipart/form-data">
        Nombre: <input type="text" name="nombre" /><br/><br/>
        
        Clave: <input type="password" name="clave" /><br/><br/>
        
        Género: 
        <label>Mujer</label><input type="radio" name="genero" value="F" />
        <label>Hombre</label><input type="radio" name="genero" value="M" /><br/><br/>
        
        Fecha de nacimiento (dd/mm/aa): <input type="text" name="fechaNacimiento" /><br/><br/>
        
        País:<br/>
        <select name="pais[]" multiple="multiple">
            <option value="ES">España</option>
            <option value="FR">Francia</option>
            <option value="IT">Italia</option>
            <option value="PT">Portugal</option>
        </select><br/><br/>
        
        <label>¡Sip, acepto las condiciones!</label><input type="checkbox" name="acepto" value="OK" /><br/><br/>
        
        Comentarios:<br/>
        <textarea name="comentarios" rows="4" cols="40"></textarea><br/><br/>
        
        Foto: <input type="file" name="foto" /><br/><br/>
        
        <input type="submit" name="enviar" value="Enviar" />
    </form>
</body>
</html>
